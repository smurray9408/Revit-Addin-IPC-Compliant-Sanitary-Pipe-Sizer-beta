name: IPC table tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build against Revit stubs and run sizing tests
        run: dotnet run --project tests/SizingTests.csproj
